<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Samuel Tavonatti</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Reindirizza la richiesta 404 a index.html preservando percorso e parametri di query
      var pathSegmentsToKeep = 0; // Imposta a 1 solo se usi repository subpath (es. username.github.io/repo-name/)

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
